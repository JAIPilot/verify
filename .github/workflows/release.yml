name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build archives
        shell: bash
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="$(mktemp -d)"
            executable=verify
            if [ "$os" = windows ]; then executable=verify.exe; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "$stage/$executable" ./cmd/verify
            cp LICENSE README.md "$stage/"
            cp -R assets docs "$stage/"
            archive="verify_${GITHUB_REF_NAME}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -r "$GITHUB_WORKSPACE/dist/$archive.zip" "$executable" LICENSE README.md assets docs)
            else
              tar -C "$stage" -czf "dist/$archive.tar.gz" "$executable" LICENSE README.md
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Verify $GITHUB_REF_NAME" --generate-notes
